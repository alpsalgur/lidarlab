[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lidarlab"
dynamic = ["version"]
description = "LiDAR recording viewer with an integrated Python console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "PySide6-Essentials>=6.8",
    "vtk>=9.4",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "qtconsole>=5.6",
    "ipykernel>=6.29",
    "jedi>=0.19",
    "matplotlib>=3.8",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.11"]

[project.scripts]
lidarlab = "lidarlab.cli:main"

[tool.hatch.version]
path = "src/lidarlab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lidarlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# examples run inside the app's shell, where frame, view and rec are defined
"src/lidarlab/examples/*" = ["F821"]
