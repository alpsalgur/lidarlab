[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lidarlab"
version = "0.1.0"
description = "LiDAR recording viewer with an integrated Python console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "PySide6-Essentials>=6.8",
    "vtk>=9.4",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "qtconsole>=5.6",
    "ipykernel>=6.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/lidarlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
